<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Auto Reload</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <h1>Tab Auto Reload</h1>

      <section id="stateCard" class="state-card stopped">
        <p id="stateLabel" class="state-label">Stopped</p>
        <p id="countdown" class="countdown">--</p>
      </section>

      <label for="intervalValue">Reload interval</label>
      <div class="interval-row">
        <input id="intervalValue" type="number" min="5" step="1" value="30">
        <select id="intervalUnit" aria-label="Interval unit">
          <option value="1" selected>seconds</option>
          <option value="60">minutes</option>
          <option value="3600">hours</option>
        </select>
      </div>

      <div id="presets" class="presets">
        <button type="button" class="chip" data-seconds="30">30s</button>
        <button type="button" class="chip" data-seconds="300">5m</button>
        <button type="button" class="chip" data-seconds="900">15m</button>
        <button type="button" class="chip" data-seconds="1800">30m</button>
        <button type="button" class="chip" data-seconds="3600">1h</button>
      </div>

      <div class="actions">
        <button id="startBtn">Start</button>
        <button id="stopBtn" class="secondary">Stop</button>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
